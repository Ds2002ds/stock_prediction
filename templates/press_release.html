<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Press Releases</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    nav {
      background-color: #333;
      overflow: hidden;
    }

    nav a {
      float: left;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      font-size: 17px;
    }

    nav a:hover {
      background-color: #ddd;
      color: black;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 40px;
    }

    .press-release {
      border-bottom: 1px solid #ccc;
      padding: 20px 0;
    }

    .press-release:last-child {
      border-bottom: none;
    }

    .press-title {
      font-size: 20px;
      color: #333;
      margin: 0 0 10px 0;
    }

    .press-date {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    .press-content {
      font-size: 16px;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      background-color: #333;
      color: white;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 15px;
      }
      .press-title {
        font-size: 18px;
      }
      .press-content {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  

  <div class="container">
    <h1>Press Releases</h1>

    <div class="press-release">
      <div class="press-title">Launch of Our New Product</div>
      <div class="press-date">December 9, 2025</div>
      <div class="press-content">
        We are excited to announce the launch of our new innovative product that aims to revolutionize the industry. The product is available starting today and will be showcased in upcoming events worldwide.
      </div>
    </div>

    

  
    



  <footer>
    &copy; 2025 IAM. All Rights Reserved.
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IAM Stock Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --surface: #0c1120;
      --surface2: #111827;
      --border: #1e2d45;
      --accent: #00e5ff;
      --accent2: #00ff88;
      --warn: #ff4d4d;
      --text: #e8edf5;
      --muted: #5a6a82;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-display);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(0,229,255,0.05);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 32px;
      letter-spacing: 0.04em;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(0,229,255,0.1);
      color: var(--accent);
    }

    /* Form */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 13px;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg {
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
    }

    .msg.success { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.25); color: var(--accent2); }
    .msg.error   { background: rgba(255,77,77,0.08);  border: 1px solid rgba(255,77,77,0.25);  color: var(--warn); }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    /* Already logged in banner */
    .already-in {
      text-align: center;
    }

    .already-in .username {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      margin: 16px 0 6px;
    }

    .already-in p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      padding: 11px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .btn-secondary:hover { border-color: var(--warn); color: var(--warn); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="logo">IAM</div>
  <div class="card-title">Welcome back</div>
  <div class="card-sub">// Stock Market Intelligence Platform</div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
  </div>

  <!-- Login Form -->
  <div id="loginForm">
    <div class="field">
      <label>Username</label>
      <input id="loginUser" type="text" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Register Form -->
  <div id="registerForm" style="display:none">
    <div class="field">
      <label>Username</label>
      <input id="regUser" type="text" placeholder="Choose a username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="regPass" type="password" placeholder="Create a password" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input id="regPass2" type="password" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="regBtn" onclick="doRegister()">Create Account</button>
    <div class="msg" id="regMsg"></div>
  </div>
</div>

<!-- Already logged in card -->
<div class="card already-in" id="loggedInCard" style="display:none">
  <div class="logo">IAM</div>
  <div class="username" id="displayName"></div>
  <p>// You are currently logged in</p>
  <a href="/" class="btn-primary" style="display:block;text-decoration:none;text-align:center;padding:13px">Go to Dashboard</a>
  <button class="btn-secondary" onclick="doLogout()">Logout</button>
</div>

<a href="/" class="back-link">← Back to Dashboard</a>

<script>
  const API = "http://127.0.0.1:8080";

  // ── Check if already logged in ──
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('iam_user');
    if (saved) {
      document.getElementById('mainCard').style.display = 'none';
      document.getElementById('loggedInCard').style.display = 'block';
      document.getElementById('displayName').textContent = saved;
    }

    // Enter key support
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('regPass2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
  });

  // ── Tab Switch ──
  function switchTab(tab) {
    document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  }

  // ── Show message ──
  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  // ── Login ──
  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;

    if (!username || !password) { showMsg('loginMsg', 'Please fill in all fields.', 'error'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in…';

    try {
      const res = await fetch(API + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        // Remember user in localStorage
        localStorage.setItem('iam_user', username);
        showMsg('loginMsg', '✓ Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = "/"; }, 1200);
      } else {
        showMsg('loginMsg', data.message || 'Invalid credentials.', 'error');
      }
    } catch {
      showMsg('loginMsg', 'Server unreachable. Is Flask running?', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  }

  // ── Register ──
  async function doRegister() {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const password2 = document.getElementById('regPass2').value;

    if (!username || !password) { showMsg('regMsg', 'Please fill in all fields.', 'error'); return; }
    if (password !== password2) { showMsg('regMsg', 'Passwords do not match.', 'error'); return; }
    if (password.length < 6)    { showMsg('regMsg', 'Password must be at least 6 characters.', 'error'); return; }

    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const res = await fetch(API + "/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        // Auto-login after register
        localStorage.setItem('iam_user', username);
        showMsg('regMsg', '✓ Account created! Redirecting…', 'success');
        setTimeout(() => { window.location.href = "/"; }, 1200);
      } else {
        showMsg('regMsg', data.message || 'Registration failed.', 'error');
      }
    } catch {
      showMsg('regMsg', 'Server unreachable. Is Flask running?', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  // ── Logout ──
  function doLogout() {
    localStorage.removeItem('iam_user');
    document.getElementById('loggedInCard').style.display = 'none';
    document.getElementById('mainCard').style.display = 'block';
  }
</script>

</body>
</html>
